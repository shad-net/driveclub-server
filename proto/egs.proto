syntax = "proto2";

message Empty {}

// ---- indexService ------------------------------------------------------------------------

message SvcEndpointDescriptor {
  optional string service = 1;
  optional string serviceMethod = 2;
  optional string requestMessage = 3;
  optional string responseMessage = 4;
  optional string httpMethod = 5;
  optional bool secure = 6;
  optional int32 initialTokens = 7;
  optional int32 maxTokens = 8;
  optional int32 tokensPerMinute = 9;
  optional bool available = 10;  // false: the method is marked unavailable for 300 s
}

message SvcEndpointDescriptorList {
  repeated SvcEndpointDescriptor endpoints = 1;
}

// ---- systemService -----------------------------------------------------------------------

message GetVersionResponse {
  optional string version = 1;
  optional string serverIdentifier = 2;
}

// ---- sessionService ----------------------------------------------------------------------

message OAuthLoginRequest {
  optional string authCode = 1;             // NpAuth authorization code
  optional string clientVersion = 2;        // e.g. "CV_bM_tP_p128_x3"
  optional bytes clientSessionData = 3;
  optional int64 clientNatIdentifier = 4;
  optional bool psPlus = 5;
  optional bool trial = 6;
  optional string name = 7;                 // online id
  optional string fbAuthToken = 8;
}

message SessionKey {
  optional string id = 1;
  optional int32 accountId = 2;
  optional string username = 3;
}

message OAuthLoginResponse {
  optional SessionKey sessionkey = 1;
  optional int32 retryHint = 2;  // read when the login failed (0xA35106)
}

message StatusResult {
  optional int32 retryHint = 1;
}

// ---- profileService ----------------------------------------------------------------------

message GetMinimalProfilesRequest {
  repeated int64 accounts = 1;
  optional bool withProgression = 2;
  optional bool withClub = 3;
}

message AccountProgression {
  optional int64 xp = 1;
}

message MinimalProfile {
  optional int64 accountId = 1;
  optional string name = 2;
  optional int64 clubId = 3;                         // read only when present
  optional AccountProgression accountProgression = 4; // read only when present
  optional int64 stars = 5;
  optional int64 elite = 6;
  optional string fbAuthToken = 7;
}

message GetMinimalProfilesResponse {
  repeated MinimalProfile profiles = 1;
}

enum ProfileOption {
  PROFILE_OPTION_0 = 0;
  PROFILE_OPTION_1 = 1;
  PROFILE_OPTION_2 = 2;
  PROFILE_OPTION_3 = 3;
}

message GetAggregatedProfilesRequest {
  repeated ProfileOption options = 1;
  repeated string accountNames = 2;
}

message AccountRef {
  optional int64 id = 1;
  optional string name = 2;
}

message IdRef {
  optional int64 id = 1;
}

message XpRef {
  optional int64 xp = 1;
}

message AggregatedProfile {
  optional AccountRef account = 1;
  optional IdRef club = 2;          // read only when present
  optional XpRef progression = 3;   // read only when present
  optional int64 stars = 4;
  optional int64 elite = 5;
  optional string fbAuthToken = 6;
}

message GetAggregatedProfilesResponse {
  repeated AggregatedProfile profiles = 1;
}

// ---- friendsListService ------------------------------------------------------------------

enum FriendType {
  FRIEND_TYPE_0 = 0;
  FRIEND_TYPE_1 = 1;
  FRIEND_TYPE_2 = 2;
}

message GetFriendsRequest {
  repeated FriendType friendTypes = 1;
}

message FriendAccount {
  optional int64 id = 1;
  optional int64 lastSeen = 2;
  optional string name = 3;
}

message Friend {
  optional FriendAccount account = 1;
}

message GetFriendsResponse {
  repeated Friend friends = 1;
}

// ---- systemService.getTimeInfo -----------------------------------------------------------

message GetTimeInfoResponse {
  optional int64 timestamp = 1;  // server time, ms since 1970
}

// ---- transactionService ------------------------------------------------------------------

message TransactionRequest {
  optional string currentTransactionId = 1;
}

message TransactionResponse {
  optional string currentTransactionId = 1;
}

// ---- profileService: fame ----------------------------------------------------------------

message FameAccountProgression {
  optional int64 xp = 1;
  optional int64 serverXp = 2;
  optional int64 stars = 3;
  optional int64 elite = 4;
}

message FameClubProgression {
  optional int64 xp = 1;
}

message GetFameResponse {
  optional FameAccountProgression accountProgression = 1;
  optional FameClubProgression clubProgression = 2;
}

message UpdateFameRequest {
  optional int64 playertotalClientFame = 1;
  optional int64 clubFameDelta = 2;
  optional int64 stars = 3;
  optional int64 elite = 4;
  optional string transactionId = 5;
}

message FameAfter {
  optional int64 xp = 1;
  optional int64 serverXp = 2;
}

message FameAccountChange {
  optional FameAfter after = 1;
}

message FameClubAfter {
  optional int64 xp = 1;
}

message FameClubChange {
  optional FameClubAfter after = 1;
}

message UpdateFameResponse {
  optional FameAccountChange accountProgression = 1;
  optional FameClubChange clubProgression = 2;
}

// ---- storageService: ghosts ("bobs") -----------------------------------------------------

enum BobObjectType {
  BOB_OBJECT_TYPE_0 = 0;
  BOB_OBJECT_TYPE_GHOST = 1;
}

enum BobAccessType {
  BOB_ACCESS_TYPE_0 = 0;
  BOB_ACCESS_TYPE_1 = 1;
}

message CreateBobRequest {
  optional string mimeType = 1;
  optional string checksum = 2;
  optional int64 contentLength = 3;
  optional bytes body = 4;
  optional BobObjectType objectType = 5;
  optional BobAccessType accessType = 6;
}

message BobFileDetails {
  optional int64 id = 1;
  optional string publicUrl = 2;
  optional string checksum = 3;
}

message CreateBobResponse {
  optional int64 id = 1;
  optional BobFileDetails fileDetails = 2;
}

message GetRemoteUrlRequest {
  optional int64 id = 1;
}

message GetRemoteUrlResponse {
  optional int64 id = 1;
  optional string publicUrl = 2;
  optional string checksum = 3;
}

// ---- statsService.getAccountStats ---------------------------------------------------------------

message GetAccountStatsRequest {
  optional string columnDefinitionSetName = 1;
  optional bool currentAccount = 2;
  repeated IdRef accounts = 3;
  optional bool currentClub = 4;
  repeated IdRef clubs = 5;
}

message StatDefinition {
  optional string name = 1;
}

message StatEntry {
  repeated int64 columns = 1;
}

message AccountStat {
  optional int32 total = 1;
  optional StatDefinition definition = 2;
  repeated StatEntry entries = 3;
}

message GetAccountStatsResponse {
  repeated string columnNames = 1;
  repeated AccountStat stats = 2;
}

