// accountService.quickSearch
message QuickSearchRequest {
  optional string startsWith = 1;
  optional GenericEnum orderBy = 2;
  optional int32 maximumEntries = 3;
}

message QuickSearchResponse {
  repeated IdOnly accounts = 1;
}

// statsService.getAccountStats
message GetAccountStatsRequest {
  optional string columnDefinitionSetName = 1;
  optional bool currentAccount = 2;
  repeated IdOnly accounts = 3;
  optional bool currentClub = 4;
  repeated IdOnly clubs = 5;
}

// The game maps each name in columnNames to one of its 41 stat columns (Attempts, TotalFame, ...);
// entries[].columns are int64 values in columnNames order. definition.name is the row's subject
// (a track, vehicle, game mode, ... depending on the set).
message StatDefinition {
  optional string name = 1;
}

message StatEntry {
  repeated int64 columns = 1;
}

message AccountStat {
  optional int32 total = 1;
  optional StatDefinition definition = 2;
  repeated StatEntry entries = 3;
}

message GetAccountStatsResponse {
  repeated string columnNames = 1;
  repeated AccountStat stats = 2;
}

// activityService.getNotifications
message GetNotificationsRequest {
  optional int32 maximumEntries = 1;
  optional int64 minVersion = 2;
  repeated GenericEnum orders = 3;
  optional int64 maxVersion = 4;
  optional string language = 5;
}

message GetNotificationsResponse {
  repeated ActivityEntry entries = 1;
}

// objectiveService.getPlayerAccoladeProgress
message GetPlayerAccoladeProgressRequest {
  optional bool currentAccount = 1;
  optional int64 accoladeId = 2;
  optional string accoladeName = 3;
  optional int64 accountId = 4;
}

message AccoladeProgress {
  optional string accoladeName = 1;
  optional GenericEnum type = 2;
  optional int64 progress = 3;
}

message GetPlayerAccoladeProgressResponse {
  repeated AccoladeProgress progressList = 1;
}

// sessionService.queryStatus: which of the asked accounts have a session (are online).
message QueryStatusRequest {
  repeated IdOnly accounts = 1;
}

message StatusSession {
  optional LobbySessionKey sessionKey = 1;
}

message QueryStatusResponse {
  repeated StatusSession sessions = 1;
  repeated IdOnly accounts = 2;
}

// activityService.getActivityFeed
message GetActivityFeedRequest {
  optional GenericEnum feedType = 1;
  optional int64 feedId = 2;
  optional string language = 3;
  optional int64 maxVersion = 4;
  optional int32 maximumEntries = 5;
}

message ActivityEntry {
  optional int64 id = 1;
  optional int64 version = 2;
  optional int64 createdBy = 3;
  optional GenericEnum authorType = 4;
  optional GenericEnum verb = 5;
  optional GenericEnum subjectType = 6;
  optional int64 club = 7;
  optional int64 createdByClub = 8;
  optional int64 subjectId = 9;
  optional string createdOn = 10;
  optional float globalRelevance = 11;
  optional string localizedActivityText = 12;
  optional string localizedElapsedTimeText = 13;
}

message GetActivityFeedResponse {
  repeated ActivityEntry entries = 1;
  repeated IdOnly clubs = 2;
}

// matchingService (MatchingComponent): interest in an event, match slots, ready state.
message MatchingRequest {
  optional int64 id = 1;
  repeated int64 eligiblePartyMembers = 2;
  optional int64 matchSlotId = 3;
  repeated int64 slotIds = 4;
  repeated int64 eventLists = 5;
}

message MatchSlotRef {
  optional int64 id = 1;
}

message RegisterInterestResponse {
  optional bool registered = 1;
  optional MatchSlotRef slot = 2;
}

message MarkReadyResponse {
  optional int64 id = 1;
  optional bool ready = 2;
}

message MatchSlotInfo {
  optional int64 slotId = 1;
  optional int32 players = 2;
  optional int32 friendsAndClubMates = 3;
}

message QueryMatchSlotsResponse {
  repeated MatchSlotInfo slots = 1;
}

message EventListActivity {
  optional int64 eventList = 1;
  optional int32 players = 2;
}

message QueryEventListActivityResponse {
  repeated EventListActivity activity = 1;
}

// lobbyService (private lobbies). The game reads and writes these by field name through the
// descriptor above, so names and types matter, numbers do not. Types follow the game's accessors
// ("is not of Enum/Int64/Bool/Bytes type"); enum values are numbered as the game compares them,
// their meaning is mostly unknown yet.

enum LobbyType {
  LOBBY_TYPE_0 = 0;
  LOBBY_TYPE_1 = 1;
  LOBBY_TYPE_2 = 2;
  LOBBY_TYPE_3 = 3;
  LOBBY_TYPE_4 = 4;
}

enum LobbyStatus {
  LOBBY_STATUS_0 = 0;
  LOBBY_STATUS_1 = 1;
  LOBBY_STATUS_2 = 2;
  LOBBY_STATUS_3 = 3;
  LOBBY_STATUS_4 = 4;
  LOBBY_STATUS_5 = 5;
  LOBBY_STATUS_6 = 6;
  LOBBY_STATUS_7 = 7;
  LOBBY_STATUS_8 = 8;
  LOBBY_STATUS_9 = 9;
  LOBBY_STATUS_10 = 10;
}

enum LobbyAction {
  LOBBY_ACTION_0 = 0;
  LOBBY_ACTION_1 = 1;
  LOBBY_ACTION_2 = 2;
  LOBBY_ACTION_3 = 3;
  LOBBY_ACTION_4 = 4;
  LOBBY_ACTION_5 = 5;
  LOBBY_ACTION_6 = 6;
  LOBBY_ACTION_7 = 7;
  LOBBY_ACTION_8 = 8;
  LOBBY_ACTION_9 = 9;
  LOBBY_ACTION_10 = 10;
  LOBBY_ACTION_11 = 11;
  LOBBY_ACTION_12 = 12;
  LOBBY_ACTION_13 = 13;
  LOBBY_ACTION_14 = 14;
  LOBBY_ACTION_15 = 15;
  LOBBY_ACTION_16 = 16;
}

enum LobbyJoinType {
  LOBBY_JOIN_TYPE_0 = 0;
  LOBBY_JOIN_TYPE_1 = 1;
  LOBBY_JOIN_TYPE_2 = 2;
  LOBBY_JOIN_TYPE_3 = 3;
}

message LobbySessionKey {
  optional string id = 1;
  optional int64 accountId = 2;
  optional string username = 3;
  optional bytes contentRestriction = 4;
}

message LobbyMember {
  optional LobbySessionKey sessionKey = 1;
  optional bool host = 2;
  optional bytes contentRestriction = 3;
  optional int32 team = 4;
  optional int32 playerNumber = 5;
  optional bytes memberData = 6;
  optional string clientVersion = 7;
  optional bool aiControlled = 8;
  optional int64 accountId = 9;
  optional int64 id = 10; // changeHost names the new host by newHost.id
}

message Lobby {
  optional string id = 1;
  optional LobbyType lobbyType = 2;
  optional LobbyStatus status = 3;
  optional string name = 4;
  optional int64 matchSlotId = 5;
  optional int64 eventListId = 6;
  repeated LobbyMember membersList = 7;
}

message LobbyList {
  repeated Lobby lobbies = 1;
  repeated LobbyMember notRemoved = 2;
  repeated LobbyResult results = 3;
}

// lobbyService.joinLobby (the private lobby game's room join, guest 0x800464fac); the game parses the
// answer as a dictionary and wants 'id', 'lobbyType', 'status' and 'membersList' in the lobby.
message JoinLobbyResponse {
  optional Lobby lobby = 1;
  repeated Lobby lobbies = 2;
}

message LobbyResult {
  repeated LobbyMember notRemoved = 1;
  optional string lobbyId = 2;
}

message LobbyAccount {
  optional int64 id = 1;
  optional string name = 2;
}

message LobbyJoinDetails {
  optional LobbySessionKey sessionKey = 1;
  optional bytes contentRestriction = 2;
  optional int64 accountId = 3;
}

// One request type for every lobbyService method: each only sets the fields it needs.
message LobbyRequest {
  optional LobbyJoinType type = 1;
  optional LobbyAccount accountToJoin = 2;
  optional LobbyJoinDetails extraJoinDetails = 3;
  optional Lobby lobby = 4;
  optional LobbyMember member = 5;
  optional string lobbyId = 6;
  optional bool migrateIfPartyLeader = 7;
  optional LobbyMember newHost = 8;
  repeated LobbyMember members = 9;
}

message LobbyCallbackMessage {
  optional LobbyAction action = 1;
  optional Lobby lobby = 2;
  optional int64 oldMatchSlotId = 3;
  repeated LobbyMember updatedMembers = 4;
  optional LobbyMember newHost = 5;
}

// clubService. Field names and types from the game's builders and parsers. A club member of type
// 2 is the owner; the game rejects a club without one ("Club has invalid members"). clubStatus 3-5
// are skipped in club lists (disbanded and the like).

message ClubRange {
  optional int32 numberOfResults = 1;
}

message QueryClubsRequest {
  repeated int64 accountIds = 1;
  repeated int64 clubIds = 2;
  optional ClubRange range = 3;
  optional GenericEnum orderBy = 4;
  repeated string clubNames = 5;
  optional bool withProgression = 6;
  optional bool withCustomization = 7;
  optional bool withMembers = 8;
  optional bool lookupRemoteUrl = 9;
}

message ClubLayer {
  optional float scale = 1;
  optional string image = 2;
  repeated string colors = 3;
}

message ClubCustomization {
  optional int64 id = 1;
  optional string liveryDescriptor = 2;
  optional string badgeBobUrl = 3;
  optional string smallBadgeBobUrl = 4;
  repeated ClubLayer layers = 5;
  repeated string tags = 6;
  optional int64 badgeBobId = 7;
  optional int64 smallBadgeBobId = 8;
}

message ClubProgression {
  optional int64 xp = 1;
}

message ClubMember {
  optional bool online = 1;
  optional int64 account = 2;
  optional GenericEnum type = 3;
  optional string createdOn = 4;
  optional bool mvp = 5;
}

message Club {
  optional int64 id = 1;
  optional string name = 2;
  optional string historicalName = 3;
  optional GenericEnum membership = 4;
  optional GenericEnum clubStatus = 5;
  optional int32 size = 6;
  optional string createdOn = 7;
  repeated ClubMember clubMembers = 8;
  optional ClubCustomization customization = 9;
  optional ClubProgression progression = 10;
}

message QueryClubsResponse {
  repeated Club clubs = 1;
}

message ClubQuickSearchRequest {
  optional string startsWith = 1;
  optional GenericEnum orderBy = 2;
  optional int32 maximumEntries = 3;
}

message ClubQuickSearchResponse {
  repeated IdOnly clubs = 1;
}

// createAndJoin, join, requestJoin, leave, rejectInvite, rejectJoinRequest, updateMembership:
// each sends or reads only some of these.
message ClubRequest {
  optional int64 id = 1;
  optional string name = 2;
  optional GenericEnum membership = 3;
}

message ClubReply {
  optional int64 id = 1;
  optional GenericEnum membership = 2;
}

message ClubNameMessage {
  optional string name = 1;
}

message ClubAccountsRequest {
  optional IdOnly club = 1;
  repeated IdOnly accounts = 2;
}

message FindClubInvitesRequest {
  optional bool clubInviteIdsNullListField = 1;
  repeated int64 clubIds = 2;
  optional bool clubIdsNullListField = 3;
  repeated int64 accountIds = 4;
  optional bool accountIdsNullListField = 5;
  optional bool invitedByNullListField = 6;
  repeated GenericEnum status = 7;
  optional bool statusNullListField = 8;
  optional bool includeExpired = 9;
  optional int32 maximumEntries = 10;
}

message ClubInvite {
  optional GenericEnum status = 1;
  optional int64 id = 2;
  optional int64 club = 3;
  optional int64 account = 4;
  optional int64 invitedBy = 5;
  optional string createdOn = 6;
  optional string updatedOn = 7;
  optional string expiresOn = 8;
}

message FindClubInvitesResponse {
  repeated ClubInvite clubInvites = 1;
}

message UpdateCustomizationRequest {
  optional bool lookupRemoteUrl = 1;
  optional ClubCustomization customization = 2;
}

message UpdateCustomizationResponse {
  repeated ClubCustomization customizations = 1;
}

// keywordService.getKeywords (club tags)
message GetKeywordsRequest {
  repeated string groupNames = 1;
}

message Keyword {
  optional string name = 1;
}

message GetKeywordsResponse {
  repeated Keyword keywords = 1;
}
