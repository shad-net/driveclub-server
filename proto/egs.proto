  optional float precipitationDuration = 3;
  optional int64 seed = 4;
  optional int64 speedOfTime = 5;
  optional float timeOfDayFloat = 6;
  optional string weather = 7;
}

message TemplateConfiguration {
  optional TemplateGeneration generation = 1;
  optional TemplatePlayerCount playerCount = 2;
  optional TemplateSettings settings = 3;
  optional TemplateEnvironment environment = 4;
}

message EventTemplate {
  optional GameModeHolder gameModeHolder = 1;
  repeated IdRef tracks = 2;   // tracks.csv UniqueID
  repeated IdRef vehicles = 3; // vehicles.csv UniqueID
  optional TemplateConfiguration configuration = 4;
}

message EventList {
  optional EventListObject object = 1;
  repeated EventTemplate templates = 2;
  optional EventListConfiguration configuration = 3;
}

message GetCurrentSeasonResponse {
  repeated EventList eventLists = 1;
  optional SeasonConfiguration configuration = 2;
}

message QueryEventListActivityRequest {
  repeated int64 eventLists = 1;
}

message EventListActivity {
  optional int64 eventList = 1;
  optional int32 players = 2;
}

message QueryEventListActivityResponse {
  repeated EventListActivity activity = 1;
}

message QueryUpcomingMatchSlotsRequest {
  repeated IdRef eventLists = 1;
  optional int32 numberOfSlots = 2;
  optional int64 startDate = 3; // Unix ms
}

message SlotEventRef {
  optional IdRef event = 1; // the track
  optional GameModeHolder gameModeHolder = 2;
}

message MatchSlot {
  optional int64 id = 1;
  optional int64 eventList = 2;
  optional int64 matchTime = 3; // Unix ms
  optional SlotEventRef event = 4;
}

message UpcomingMatchSlot {
  optional MatchSlot slot = 1;
  optional int32 players = 2;
  optional int32 friends = 3;
  optional int32 clubMates = 4;
  optional int32 friendsAndClubMates = 5;
  optional bool registered = 6;
}

message QueryUpcomingMatchSlotsResponse {
  repeated UpcomingMatchSlot slots = 1;
}

message RegisterInterestRequest {
  optional int64 id = 1;
  repeated int64 eligiblePartyMembers = 2;
}

message InterestResponse {
  optional bool registered = 1;
  optional IdRef slot = 2;
}

message QueryInterestRequest {
  repeated IdRef accounts = 1;
}

message InterestSlot {
  optional IdRef slot = 1;
  optional string startsInMilliSeconds = 2;
  optional string startsInSeconds = 3;
}

message QueryInterestResponse {
  repeated InterestSlot slots = 1;
}

message QueryMatchSlotsByIdRequest {
  repeated int64 slotIds = 1;
}

message MatchSlotCount {
  optional int64 slotId = 1;
  optional int32 players = 2;
  optional int32 friendsAndClubMates = 3;
}

message QueryMatchSlotsByIdResponse {
  repeated MatchSlotCount slots = 1;
}

message MarkReadyRequest {
  optional int64 matchSlotId = 1;
}

message MarkReadyResponse {
  optional int64 id = 1;
  optional bool ready = 2;
}

message ProgressToNextRaceRequest {
  optional string id = 1;
}

message MatchingCallbackMessage {
  optional int64 accountId = 1;
  optional EventValue action = 2;
  optional int64 matchSlotId = 3;
  optional int64 startsInMilliseconds = 4;
}

// ---- configurationService, activityService ------------------------------------------------------

message TelemetryConfig {
  optional string destinationRoot = 1;
  optional string environment = 2;
  optional string messageServer = 3;
  optional string password = 4;
  optional string port = 5;
  optional string username = 6;
  optional string virtualHost = 7;
  repeated string enabledMessages = 8;
}

message UiConfig {
  optional bool enableButtonChallenge = 1;
  optional bool enableButtonChallengeCreate = 2;
  optional bool enableButtonDrive = 3;
  optional bool enableButtonMultiPlayer = 4;
  optional bool enableButtonSingleEvent = 5;
  optional bool enableButtonTour = 6;
  optional bool enableButtonFacebook = 7;
  optional bool betaIsActive = 8;
}

message GameConfiguration {
  optional TelemetryConfig telemetry = 1;
  optional UiConfig uiConfig = 2;
}

message GlobalGameConfiguration {
  optional GameConfiguration configuration = 1;
}

message GetActivityFeedRequest {
  optional EventValue feedType = 1;
  optional int64 feedId = 2;
  optional string language = 3;
  optional int64 maxVersion = 4;
  optional int32 maximumEntries = 5;
}

message ActivityEntry {
  optional int64 id = 1;
  optional int64 version = 2;
  optional int64 createdBy = 3;
  optional EventValue authorType = 4;
  optional EventValue verb = 5;
  optional EventValue subjectType = 6;
  optional int64 club = 7;
  optional int64 createdByClub = 8;
  optional int64 subjectId = 9;
  optional string createdOn = 10;
  optional float globalRelevance = 11;
  optional string localizedActivityText = 12;
  optional string localizedElapsedTimeText = 13;
}

message GetActivityFeedResponse {
  repeated ActivityEntry entries = 1;
  repeated IdRef clubs = 2;
}

message GetNotificationsRequest {
  optional int32 maximumEntries = 1;
  optional int64 minVersion = 2;
  repeated EventValue orders = 3;
  optional int64 maxVersion = 4;
  optional string language = 5;
}

message GetNotificationsResponse {
  repeated ActivityEntry entries = 1;
}
